<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web App</title>
</head>
<body>

    <h1>Web App Output</h1>
    <div id="result">Data loading...</div>

    <script>
        // Page poora load hone ke baad JavaScript chalegi
        document.addEventListener("DOMContentLoaded", function() {
            
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxCAzNfLln35J4feJDIg9R14j_iY_VwMJnvNWz6iN6dglW9eXcb537F2iozrjaWV3fQ/exec';

            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    console.log("Data received successfully:", data);
                    const resultDiv = document.getElementById('result');
                    if (resultDiv) {
                        resultDiv.innerText = data.message;
                    }
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    const resultDiv = document.getElementById('result');
                    if (resultDiv) {
                        resultDiv.innerText = 'Failed to load data. Make sure you open this via http/https, not file://';
                    }
                });
                
        });
    </script>
</body>
</html>
